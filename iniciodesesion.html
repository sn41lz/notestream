<html>
 <head>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet"/>
  <link rel="icon" href="imagen (1).png">
  <style>
   body {
            font-family: 'Roboto', sans-serif;
        }
  </style>
 </head>
 <body class="bg-black text-white flex items-center justify-center min-h-screen">
  <div class="w-full max-w-sm p-6">
   <div class="text-center mb-8">
    <img alt="NoteStream Logo" class="mx-auto mb-4" height="50" src="imagen (1).png" width="50"/>
    <h1 class="text-2xl font-bold">
     Inicia sesión en NoteStream
    </h1>
   </div>
   <div class="space-y-4">
    <button class="w-full flex items-center justify-center bg-gray-800 text-white py-2 rounded-full">
     <i class="fab fa-google mr-2">
     </i>
     Continuar con Google
    </button>
    <button class="w-full flex items-center justify-center bg-gray-800 text-white py-2 rounded-full">
     <i class="fab fa-facebook-f mr-2">
     </i>
     Continuar con Facebook
    </button>
    <button class="w-full flex items-center justify-center bg-gray-800 text-white py-2 rounded-full">
     <i class="fab fa-apple mr-2">
     </i>
     Continuar con Apple
    </button>
   </div>
   <div class="mt-8">
    <div class="mb-4">
     <label class="block text-sm font-bold mb-2" for="email">
      Email o nombre de usuario
     </label>
     <input class="w-full px-3 py-2 bg-gray-800 text-white rounded border border-gray-700 focus:outline-none focus:border-gray-500" id="email" placeholder="Email o nombre de usuario" type="text"/>
    </div>
    <div class="mb-4">
     <label class="block text-sm font-bold mb-2" for="password">
      Contraseña
     </label>
     <div class="relative">
      <input class="w-full px-3 py-2 bg-gray-800 text-white rounded border border-gray-700 focus:outline-none focus:border-gray-500" id="password" placeholder="Contraseña" type="password"/>
      <i class="fas fa-eye absolute right-3 top-3 text-gray-500">
      </i>
     </div>
    </div>
    <button class="w-full bg-purple-500 text-black py-2 rounded-full font-bold">
     Iniciar Sesión
    </button>
   </div>
   <div class="mt-4 text-center">
    <a class="text-sm text-gray-400 hover:underline" href="#">
     ¿Has olvidado tu contraseña?
    </a>
   </div>
   <div class="mt-2 text-center">
    <span class="text-sm text-gray-400">
     ¿No tienes cuenta?
     <a class="hover:underline" href="registro.html">
      Regístrate en NoteStream
     </a>
     <div class="text-center mt-4">
        <p class="text-sm">Volver al inicio? <a href="index.html" class="text-white underline">Pulsa aquí.</a></p>
    </div>
     <div class="text-center text-xs text-gray-400 mt-4">
        <p>This site is protected by reCAPTCHA and the Google <a href="#" class="text-white underline">Privacy Policy</a> and <a href="#" class="text-white underline">Terms of Service</a> apply.</p>
    </div>
    </span>
   </div>
  </div>
 </body>
</html>
