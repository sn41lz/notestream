<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="registro.css">
    <link rel="icon" href="imagen (1).png">
</head>
<body class="bg-black text-white font-roboto flex items-center justify-center min-h-screen">
    <div class="w-full max-w-sm p-6">
        <div class="flex justify-center mb-6">
            <img src="imagen (1).png" alt="NoteStream logo" class="w-12 h-12" width="50" height="50">
        </div>
        <h1 class="text-3xl font-bold text-center mb-6">Regístrate para empezar a escuchar contenido</h1>
        <form>
            <label for="email" class="block text-sm mb-2">Dirección de correo electrónico</label>
            <input type="email" id="email" placeholder="nombre@dominio.com" class="w-full p-3 mb-4 text-black rounded">
            <button type="submit" class="w-full bg-purple-600 text-black py-3 rounded font-bold mb-4">Siguiente</button>
        </form>
        <div class="flex items-center mb-4">
            <hr class="flex-grow border-gray-600">
            <span class="px-2 text-gray-400">o</span>
            <hr class="flex-grow border-gray-600">
        </div>
        <button class="w-full flex items-center justify-center bg-gray-800 py-3 rounded mb-4">
            <i class="fab fa-google text-xl mr-2"></i> Registrarte con Google
        </button>
        <button class="w-full flex items-center justify-center bg-gray-800 py-3 rounded mb-4">
            <i class="fab fa-facebook text-xl mr-2"></i> Registrarte con Facebook
        </button>
        <button class="w-full flex items-center justify-center bg-gray-800 py-3 rounded mb-4">
            <i class="fab fa-apple text-xl mr-2"></i> Registrarte con Apple
        </button>
        <div class="text-center mt-4">
            <p class="text-sm">¿Ya tienes una cuenta? <a href="Iniciodesesion.html" class="text-white underline">Inicia sesión aquí.</a></p>
        </div>
        <div class="text-center mt-4">
            <p class="text-sm">Volver al inicio? <a href="index.html" class="text-white underline">Pulsa aquí.</a></p>
        </div>
        <div class="text-center text-xs text-gray-400 mt-4">
            <p>This site is protected by reCAPTCHA and the Google <a href="#" class="text-white underline">Privacy Policy</a> and <a href="#" class="text-white underline">Terms of Service</a> apply.</p>
        </div>
    </div>
</body>
</html>
